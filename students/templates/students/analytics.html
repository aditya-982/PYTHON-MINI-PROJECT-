<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 1200px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-chart-pie text-primary me-2"></i>Multi-Graph Analytics Suite</h2>
            <a href="/" class="btn btn-outline-light btn-sm">Back to Search</a>
        </div>
        
        <!-- Summary Stat Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="glass-card p-3 text-center">
                    <small class="text-secondary">Total Students</small>
                    <h3 class="text-primary">{{ total_count }}</h3>
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-card p-3 text-center">
                    <small class="text-secondary">System-Wide Average GPA</small>
                    <h3 class="text-warning">{{ avg_gpa|floatformat:2 }}</h3>
                </div>
            </div>
        </div>

        <!-- 6 Graphs Grid (3 columns per row) -->
        <div class="row g-4">
            <div class="col-md-4">
                <div class="glass-card p-3 text-center h-100">
                    <h6 class="text-info mb-2">Course Breakdown</h6>
                    <img src="data:image/png;base64,{{ chart1_uri }}" class="img-fluid rounded">
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card p-3 text-center h-100">
                    <h6 class="text-success mb-2">GPA Histogram</h6>
                    <img src="data:image/png;base64,{{ chart2_uri }}" class="img-fluid rounded">
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card p-3 text-center h-100">
                    <h6 class="text-warning mb-2">Enrollment Years</h6>
                    <img src="data:image/png;base64,{{ chart3_uri }}" class="img-fluid rounded">
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card p-3 text-center h-100">
                    <h6 class="text-primary mb-2">Avg GPA by Course</h6>
                    <img src="data:image/png;base64,{{ chart4_uri }}" class="img-fluid rounded">
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card p-3 text-center h-100">
                    <h6 class="text-danger mb-2">Performance Tiers</h6>
                    <img src="data:image/png;base64,{{ chart5_uri }}" class="img-fluid rounded">
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card p-3 text-center h-100">
                    <h6 class="text-light mb-2">Student GPA Spread</h6>
                    <img src="data:image/png;base64,{{ chart6_uri }}" class="img-fluid rounded">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
